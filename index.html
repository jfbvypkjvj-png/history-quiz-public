<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歴史テスト完全攻略｜暗記カード</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--accent:#4f46e5;--good:#16a34a;--bad:#dc2626;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 48px}.hero{background:linear-gradient(135deg,#111827,#3730a3);color:#fff;border-radius:24px;padding:22px 20px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}.modes{display:flex;gap:8px;flex-wrap:wrap}.mode,.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font:inherit;font-weight:800;cursor:pointer}.mode{border-radius:999px;font-size:13px}.mode.active{background:#eef2ff;border-color:#a5b4fc;color:#3730a3}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.hidden{display:none!important}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font:inherit}.card{perspective:1000px;cursor:pointer;min-height:380px}.inner{position:relative;min-height:380px;transition:transform .55s;transform-style:preserve-3d}.card.flipped .inner{transform:rotateY(180deg)} .card.showAnswer .front{display:none!important}.card.showAnswer .back{position:relative!important;transform:none!important;display:flex!important;min-height:380px}.card.showAnswer .inner{transform:none!important;min-height:380px}.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 10px 25px #0001}.front{background:#fff}.back{background:#eef2ff;transform:rotateY(180deg);overflow:auto}.label{font-size:12px;color:var(--accent);font-weight:900;margin-bottom:14px}.q{font-size:21px;line-height:1.65;font-weight:900}.answer{font-size:27px;line-height:1.5;font-weight:1000;color:#3730a3}.exp{font-size:14px;line-height:1.8;margin-top:14px}.hint,.small{color:var(--muted);font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.good{background:#f0fdf4;border-color:#86efac;color:#166534}.bad{background:#fef2f2;border-color:#fca5a5;color:#991b1b}.next{background:var(--accent);color:#fff;border-color:var(--accent)}.status{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.box{border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-weight:900}.box b{display:block;font-size:22px}.item{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;background:#fafafa}.item b{display:block;margin-bottom:6px}@media(max-width:520px){.controls,.actions{grid-template-columns:1fr}.q{font-size:19px}.answer{font-size:24px}.card,.inner{min-height:410px}}</style></head><body><div class="wrap"><div class="hero"><h1>📚 歴史テスト完全攻略</h1><p>問題をタップすると答えが出る暗記カード。答えを見たら「合ってた／間違えた」で記録できます。</p></div><section id="home"><div class="panel"><h3>① 歴史の範囲を選ぶ</h3><div class="modes" id="periods"><button class="mode active" data-p="all">全範囲</button><button class="mode" data-p="prewar">第一次世界大戦〜第二次世界大戦終戦（収録分）</button><button class="mode" data-p="ww2">第二次世界大戦〜終戦</button><button class="mode" data-p="postwar">戦後日本〜冷戦</button><button class="mode" data-p="growth">高度経済成長〜現代</button></div><p class="small">※現在の274問の収録内容に基づく範囲分けです。</p></div><div class="panel"><h3>② 出題する項目</h3>
<div class="modes" id="types">
<button class="mode active" data-type="all">全部</button>
<button class="mode" data-type="用語">用語</button>
<button class="mode" data-type="理解">内容・理解</button>
<button class="mode" data-type="原因・目的">原因・目的</button>
<button class="mode" data-type="結果・影響">結果・影響</button>
<button class="mode" data-type="人名">人名</button>
</div></div>
<div class="panel"><h3>② 問題数</h3><div class="controls"><select id="count"><option value="10">10問</option><option value="20">20問</option><option value="30">30問</option><option value="50">50問</option><option value="all">全問</option></select><select id="order"><option value="random">ランダム</option><option value="normal">順番どおり</option></select></div><button id="start" class="btn primary" style="margin-top:10px">暗記カードを始める</button></div><div class="panel"><div class="status"><div class="box"><b id="kh">0</b>できた</div><div class="box"><b id="wh">0</b>間違えた</div><div class="box"><b id="th">0</b>回答済み</div></div><button id="review" class="btn" style="margin-top:10px;width:100%">間違えた問題だけ復習</button></div></section><section id="quiz" class="hidden"><div class="panel"><button id="quit" class="btn">← 終了</button><div style="display:flex;justify-content:space-between;margin:10px 0;font-size:12px;color:var(--muted);font-weight:800"><span id="num"></span><span id="period"></span></div><div style="height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden"><div id="bar" style="height:100%;background:var(--accent);width:0"></div></div><div id="card" class="card" style="margin-top:14px"><div class="inner"><div class="face front"><div class="label">問題</div><div id="q" class="q"></div><div class="hint" style="margin-top:18px">👆 タップして答えを見る</div></div><div class="face back"><div class="label">答え</div><div id="a" class="answer"></div><div id="e" class="exp"></div></div></div></div><div id="actions" class="actions hidden"><button id="wrong" class="btn bad">❌ 間違えた</button><button id="correct" class="btn good">⭕ 合ってた</button><button id="next" class="btn next">次へ →</button></div></div><div class="panel"><div class="status"><div class="box"><b id="k">0</b>できた</div><div class="box"><b id="w">0</b>間違えた</div><div class="box"><b id="t">0</b>回答済み</div></div></div></section><section id="result" class="hidden"><div class="panel"><h2>🎉 終了！</h2><div class="status"><div class="box"><b id="fk">0</b>できた</div><div class="box"><b id="fw">0</b>間違えた</div><div class="box"><b id="fr">0%</b>正答率</div></div><div id="lists" style="margin-top:14px"></div><button id="backHome" class="btn primary" style="width:100%;margin-top:12px">範囲選択に戻る</button></div></section></div><script>const BANK=[{"id":"t1","type":"用語","q":"1929年10月24日、ニューヨーク株式市場の株価大暴落をきっかけに始まった世界的な不況を何という？","choices":["冷戦","石油危機","金融恐慌","世界恐慌"],"a":3,"exp":"株価大暴落をきっかけに深刻な不況がアメリカから世界へ広がった。","tag":"用語","period":"prewar"},{"id":"u1","type":"理解","q":"「世界恐慌」について、どのような内容か？","choices":["株価大暴落をきっかけに深刻な不況がアメリカから世界へ広がった","アメリカのマッカーサーを最高司令官とするGHQが占領政策を進めた","盧溝橋事件をきっかけに日中両国の戦闘が拡大し、戦争が長期化した","公共事業などで雇用を増やし、農産物の生産調整や金融改革を進めて国民の購買力を高めようとした"],"a":0,"exp":"株価大暴落をきっかけに深刻な不況がアメリカから世界へ広がった。","tag":"用語・内容","period":"prewar"},{"id":"t2","type":"用語","q":"世界恐慌への対策として、ルーズベルト大統領が行った政策を何という？","choices":["ブロック経済","ニューディール政策","ドッジ・ライン","五か年計画"],"a":1,"exp":"公共事業などで雇用を増やし、農産物の生産調整や金融改革を進めて国民の購買力を高めようとした。","tag":"用語","period":"prewar"},{"id":"u2","type":"理解","q":"「ニューディール政策」について、どのような内容か？","choices":["日本への経済制裁・資源面の圧力を指す","公共事業などで雇用を増やし、農産物の生産調整や金融改革を進めて国民の購買力を高めようとした","関東軍が奉天郊外の柳条湖で鉄道を爆破して攻撃を開始し、満州を占領した","地主の土地を小作人に売り渡し、自作農が増えた"],"a":1,"exp":"公共事業などで雇用を増やし、農産物の生産調整や金融改革を進めて国民の購買力を高めようとした。","tag":"用語・内容","period":"prewar"},{"id":"t3","type":"用語","q":"ニューディール政策で公共事業などを行った主な目的は？","choices":["雇用を増やし景気を回復させる","植民地を増やす","国際連盟を解散する","軍縮を進める"],"a":0,"exp":"失業者を救済し、公共事業で雇用と購買力を高めて不況からの回復を目指した。","tag":"原因・目的","period":"prewar"},{"id":"u3","type":"理解","q":"「ニューディール目的」について、どのような内容か？","choices":["北京郊外の盧溝橋で日本軍と中国軍が衝突し、日中戦争へ拡大した","公布は1946年11月3日、施行は1947年5月3日","占領下で軍隊の解散、政治・経済・社会の民主化などが進められた","失業者を救済し、公共事業で雇用と購買力を高めて不況からの回復を目指した"],"a":3,"exp":"失業者を救済し、公共事業で雇用と購買力を高めて不況からの回復を目指した。","tag":"原因・目的","period":"prewar"},{"id":"t4","type":"用語","q":"イギリス・フランスなどが世界恐慌後に行った、植民地との結びつきを強め自国・植民地以外の商品を締め出す政策を何という？","choices":["三国同盟","ニューディール","五か年計画","ブロック経済"],"a":3,"exp":"植民地との経済的結びつきを強め、高関税などで他国の商品を排除した。","tag":"用語","period":"prewar"},{"id":"u4","type":"理解","q":"「ブロック経済」について、どのような内容か？","choices":["東ドイツから西側への人々の移動を防ぐために建設され、冷戦の象徴となった","真珠湾攻撃をきっかけに日本とアメリカ・イギリスなどとの戦争が始まった","植民地との経済的結びつきを強め、高関税などで他国の商品を排除した","労働者の権利を保障し、労働運動を民主化する一環となった"],"a":2,"exp":"植民地との経済的結びつきを強め、高関税などで他国の商品を排除した。","tag":"用語・内容","period":"prewar"},{"id":"t5","type":"用語","q":"ブロック経済が広がると、植民地を多く持たない国はどうなりやすかった？","choices":["軍備をすべて廃止した","国際連盟に必ず加盟した","海外市場や資源を求めて対外進出を強めた","植民地をすべて独立させた"],"a":2,"exp":"市場や資源を求めて、ドイツ・イタリア・日本などが対外進出を強める一因になった。","tag":"結果・影響","period":"prewar"},{"id":"u5","type":"理解","q":"「ブロック経済影響」について、どのような内容か？","choices":["市場や資源を求めて、ドイツ・イタリア・日本などが対外進出を強める一因になった","東京裁判とも呼ばれ、戦争指導者らが裁かれた","1945年、サンフランシスコ会議で国連憲章が採択され、同年10月に国連が成立した","日ソ共同宣言で国交を回復し、日本は同年国際連合に加盟した"],"a":0,"exp":"市場や資源を求めて、ドイツ・イタリア・日本などが対外進出を強める一因になった。","tag":"結果・影響","period":"prewar"},{"id":"t6","type":"用語","q":"1933年にドイツで政権を握り、独裁政治を行った政党は？","choices":["自由民主党","社会民主党","ナチス（国民社会主義ドイツ労働者党）","共産党"],"a":2,"exp":"ヒトラー率いるナチスが政権を握り、再軍備やユダヤ人迫害を進めた。","tag":"用語","period":"growth"},{"id":"u6","type":"理解","q":"「ナチス」について、どのような内容か？","choices":["ヒトラー率いるナチスが政権を握り、再軍備やユダヤ人迫害を進めた","北朝鮮の南進で始まり、米軍中心の国連軍と中国軍などが介入","労働時間や賃金などの最低基準を定め、労働者を保護した","水俣病・四日市ぜんそく・イタイイタイ病・新潟水俣病などの深刻な公害を背景に制定された"],"a":0,"exp":"ヒトラー率いるナチスが政権を握り、再軍備やユダヤ人迫害を進めた。","tag":"用語・内容","period":"growth"},{"id":"t7","type":"用語","q":"ヒトラーのドイツやムッソリーニのイタリアに見られた独裁的・排外的な政治運動を何という？","choices":["民主主義","ファシズム","平和主義","自由主義"],"a":1,"exp":"強い指導者のもとで反対勢力を抑え、軍事力や国家への服従を重視した。","tag":"用語","period":"growth"},{"id":"u7","type":"理解","q":"「ファシズム」について、どのような内容か？","choices":["北方領土の帰属をめぐる問題が残り、日露間では平和条約が結ばれていない","国際平和・安全の維持や国際協力を目的とする","強い指導者のもとで反対勢力を抑え、軍事力や国家への服従を重視した","1965年に国交を正常化した"],"a":2,"exp":"強い指導者のもとで反対勢力を抑え、軍事力や国家への服従を重視した。","tag":"用語・内容","period":"growth"},{"id":"t8","type":"用語","q":"スターリンがソ連で進めた政策は？","choices":["ドッジ・ライン","ブロック経済","ニューディール政策","五か年計画"],"a":3,"exp":"農業の集団化と重工業の発展を進め、世界恐慌の影響を受けにくい経済体制を目指した。","tag":"用語","period":"prewar"},{"id":"u8","type":"理解","q":"「ソ連五か年計画」について、どのような内容か？","choices":["東南アジア諸国連合","農業の集団化と重工業の発展を進め、世界恐慌の影響を受けにくい経済体制を目指した","アメリカ軍からの大量の軍需物資の注文で特需が起こり、日本経済の復興が進んだ","1971年に環境庁が設置され、2001年に環境省へ改組された"],"a":1,"exp":"農業の集団化と重工業の発展を進め、世界恐慌の影響を受けにくい経済体制を目指した。","tag":"用語・内容","period":"prewar"},{"id":"t9","type":"用語","q":"1931年、日本の関東軍が南満州鉄道の線路を爆破して攻撃を始め、満州を占領した事件は？","choices":["五・一五事件","満州事変","二・二六事件","盧溝橋事件"],"a":1,"exp":"関東軍が奉天郊外の柳条湖で鉄道を爆破して攻撃を開始し、満州を占領した。","tag":"用語","period":"prewar"},{"id":"u9","type":"理解","q":"「満州事変」について、どのような内容か？","choices":["1954年の第五福竜丸事件などをきっかけに、原水爆禁止運動が盛んになった","国連の平和維持活動への協力として、自衛隊の海外派遣を可能にした","関東軍が奉天郊外の柳条湖で鉄道を爆破して攻撃を開始し、満州を占領した","1972年、田中角栄内閣のもとで日中国交正常化が実現した"],"a":2,"exp":"関東軍が奉天郊外の柳条湖で鉄道を爆破して攻撃を開始し、満州を占領した。","tag":"用語・内容","period":"prewar"},{"id":"t10","type":"用語","q":"満州事変の翌年、日本が満州に建国した国は？","choices":["中華人民共和国","北朝鮮","大韓民国","満州国"],"a":3,"exp":"日本は満州国を建て、清最後の皇帝溥儀を元首とした。","tag":"用語","period":"prewar"},{"id":"u10","type":"理解","q":"「満州国」について、どのような内容か？","choices":["ソ連の改革を背景に東欧諸国で民主化が進み、共産党政権が次々に倒れた","アラブ産油国が原油輸出禁止や価格引き上げを行い、世界経済に打撃を与えた","公共事業などで雇用を増やし、農産物の生産調整や金融改革を進めて国民の購買力を高めようとした","日本は満州国を建て、清最後の皇帝溥儀を元首とした"],"a":3,"exp":"日本は満州国を建て、清最後の皇帝溥儀を元首とした。","tag":"用語・内容","period":"prewar"},{"id":"t11","type":"用語","q":"満州事変後、国際連盟が日本の行動を調査するために派遣した調査団は？","choices":["GHQ","リットン調査団","国連軍","三国協商"],"a":1,"exp":"調査団は満州事変を日本の侵略行為と判断し、日本軍の撤退を勧告した。","tag":"用語","period":"prewar"},{"id":"u11","type":"理解","q":"「リットン調査団」について、どのような内容か？","choices":["バブル崩壊後、景気低迷が続き、1990年代には金融機関などの問題が深刻化した","関東軍が奉天郊外の柳条湖で鉄道を爆破して攻撃を開始し、満州を占領した","調査団は満州事変を日本の侵略行為と判断し、日本軍の撤退を勧告した","1978年に締結され、日中関係の安定に向けた基礎となった"],"a":2,"exp":"調査団は満州事変を日本の侵略行為と判断し、日本軍の撤退を勧告した。","tag":"用語・内容","period":"prewar"},{"id":"t12","type":"用語","q":"日本が国際連盟を脱退したのはなぜ？","choices":["日独伊三国同盟を解消するため","世界恐慌を防ぐため","アメリカに加盟を禁止されたため","満州国を認めず日本軍の撤退を勧告されたため"],"a":3,"exp":"日本はリットン報告書を受け入れず、1933年に国際連盟を脱退した。","tag":"原因・目的","period":"prewar"},{"id":"u12","type":"理解","q":"「国際連盟脱退」について、どのような内容か？","choices":["1989年にベルリンの壁が撤去され、翌年東西ドイツが統一した","1937年、日本軍は南京を占領し、その際に多数の中国人などが犠牲になった","日本はリットン報告書を受け入れず、1933年に国際連盟を脱退した","失業者を救済し、公共事業で雇用と購買力を高めて不況からの回復を目指した"],"a":2,"exp":"日本はリットン報告書を受け入れず、1933年に .getElementById(x);function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(id,ok){let k=JSON.parse(localStorage.getItem('historyFlashKnown')||'[]'),w=JSON.parse(localStorage.getItem('historyFlashWeak')||'[]');k=k.filter(x=>x!==id);w=w.filter(x=>x!==id);(ok?k:w).push(id);localStorage.setItem('historyFlashKnown',JSON.stringify([...new Set(k)]));localStorage.setItem('historyFlashWeak',JSON.stringify([...new Set(w)]))}function stats(){let k=JSON.parse(localStorage.getItem('historyFlashKnown')||'[]'),w=JSON.parse(localStorage.getItem('historyFlashWeak')||'[]');$('kh').textContent=k.length;$('wh').textContent=w.length;$('th').textContent=new Set([...k,...w]).size}function category(q){
  const text=String(q.q||'');
  const tag=String(q.tag||'');
  const ans=(Array.isArray(q.choices)&&Number.isInteger(q.a))?String(q.choices[q.a]||''):'';

  // 人名：人物を答えることが目的の問題を最優先。

    return '人名';
  }

  // 原因・目的
  if(/なぜ|何を目的|主な目的|目的は|ねらい|理由は|背景は/.test(text)) return '原因・目的';

  // 結果・影響
  if(/どうなった|どうなり|どうなりやすかった|どのような影響|影響は|結果は|結果として|その結果/.test(text)) return '結果・影響';

  // 内容・理解
  if(/どのような内容|どんな内容|内容は|何を定め|何を決め|何が定め|古い順に並べ|正しい順に並べ/.test(text)) return '理解';

  // 用語：出来事・政策・制度などの「名称」を答える問題。

  // 明示的なタグは最後の保険として使用。
  if(tag==='人名') return '人名';
  if(tag==='用語'||tag==='年代') return '用語';
  if(tag==='原因・目的') return '原因・目的';
  if(tag==='結果・影響') return '結果・影響';
  return '理解';
}
function pool(){
  let a=BANK.filter(q=>(period==='all'||q.period===period));
  if(period==='ww2') a=a.filter(q=>q.period==='prewar');
  if(selectedType!=='all') a=a.filter(q=>category(q)===selectedType);
  if(reviewMode){
    let ids=JSON.parse(localStorage.getItem('historyFlashWeak')||'[]');

  return a;
}function start(){reviewMode=false;let a=pool();if(!a.length){alert('この範囲に問題がありません');return}session=[...a];if($('order').value==='random')shuffle(session);if($('count').value!=='all')session=session.slice(0,Math.min(+$('count').value,session.length));pos=0;known=[];weak=[];$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){let x=session[pos];answered=false;$('card').classList.remove('flipped','showAnswer');$('actions').classList.add('hidden');$('correct').disabled=false;$('wrong').disabled=false;$('num').textContent=(pos+1)+' / '+session.length;$('period').textContent=reviewMode?'間違えた問題の復習':PL[x.period];if($('cat'))$('cat').textContent=category(x);$('bar').style.width=(pos/session.length*100)+'%';$('q').textContent=x.q;$('a').textContent=x.choices[x.a];$('e').textContent=x.exp||'解説なし';upd()}function upd(){$('k').textContent=known.length;$('w').textContent=weak.length;$('t').textContent=known.length+weak.length}function mark(ok){if(answered)return;answered=true;let id=session[pos].id;if(ok)known.push(id);else weak.push(id);save(id,ok);upd();$('correct').disabled=true;$('wrong').disabled=true}function finish(){let map=new Map(BANK.map(x=>[x.id,x]));$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('fk').textContent=known.length;$('fw').textContent=weak.length;$('fr').textContent=Math.round(known.length/session.length*100)+'%';$('lists').innerHTML='<h3>⭕ できた問題</h3>'+known.map((id,i)=>'<div class="item"><b>'+(i+1)+'. '+map.get(id).q+'</b>答え：'+map.get(id).choices[map.get(id).a]+'</div>').join('')+'<h3 style="margin-top:18px">❌ 間違えた問題</h3>'+weak.map((id,i)=>'<div class="item"><b>'+(i+1)+'. '+map.get(id).q+'</b>正解：'+map.get(id).choices[map.get(id).a]+'<p class="small">'+(map.get(id).exp||'')+'</p></div>').join('')}$('card').onclick=()=>{if(!answered){$('card').classList.add('showAnswer');$('actions').classList.remove('hidden')}};$('correct').onclick=()=>mark(true);$('wrong').onclick=()=>mark(false);$('next').onclick=()=>{if(!answered){alert('まず「合ってた」か「間違えた」を押してね');return}if(pos<session.length-1){pos++;render()}else finish()};$('start').onclick=start;$('review').onclick=()=>{let ids=JSON.parse(localStorage.getItem('historyFlashWeak')||'[]');if(!ids.length){alert('まだ間違えた問題はありません');return}reviewMode=true;session=shuffle(BANK.filter(q=>ids.includes(q.id)));pos=0;known=[];weak=[];$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};$('quit').onclick=()=>{$('quiz').classList.add('hidden');$('home').classList.remove('hidden');stats()};$('backHome').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden');stats()};document.querySelectorAll('#types .mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('#types .mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedType=b.dataset.type});document.querySelectorAll('#periods .mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('#periods .mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');period=b.dataset.p});stats()</script></body></html>
